<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Breadboard Bench</title>
<meta name="description" content="Breadboard Bench: a free digital-logic simulator for The Breadboard Computer (PC-2).">
<meta name="theme-color" content="#1B2A41">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
<script>
  // apply the saved theme before first paint
  try { const t = localStorage.getItem("bb-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="band" aria-hidden="true"></div>
    <div class="brand">
      <svg class="logo" viewBox="0 0 40 40" aria-hidden="true"><rect x="4" y="9" width="32" height="22" rx="4" class="logo-board"/><rect x="11" y="14" width="18" height="12" rx="2" class="logo-chip"/><g class="logo-pins"><rect x="13" y="11" width="2" height="3"/><rect x="17" y="11" width="2" height="3"/><rect x="21" y="11" width="2" height="3"/><rect x="25" y="11" width="2" height="3"/><rect x="13" y="26" width="2" height="3"/><rect x="17" y="26" width="2" height="3"/><rect x="21" y="26" width="2" height="3"/><rect x="25" y="26" width="2" height="3"/></g><circle cx="14" cy="17" r="1.2" class="logo-dot"/></svg>
      <div class="brand-text"><span class="brand-name">Breadboard Bench</span><span class="brand-sub">for <i>The Breadboard Computer</i></span></div>
    </div>
    <div class="projname" title="Project name">
      <label class="sr" for="proj-name">Project name</label>
      <input id="proj-name" spellcheck="false" value="Untitled">
      <span id="dirty" class="dirty" aria-live="polite"></span>
    </div>
    <nav class="actions" aria-label="Project">
      <button id="btn-new" class="btn ghost" title="Start a new empty project">New</button>
      <button id="btn-open" class="btn ghost" title="Open a .bbproj file (Ctrl+O)">Open…</button>
      <button id="btn-save" class="btn ghost" title="Save as a .bbproj file (Ctrl+S)">Save</button>
      <div class="menu">
        <button id="btn-examples" class="btn" aria-haspopup="true" aria-expanded="false">Examples <span aria-hidden="true">▾</span></button>
        <div id="examples-menu" class="menu-pop" role="menu" hidden></div>
      </div>
      <button id="btn-undo" class="btn icon" title="Undo (Ctrl+Z)" aria-label="Undo">↶</button>
      <button id="btn-redo" class="btn icon" title="Redo (Ctrl+Y)" aria-label="Redo">↷</button>
      <button id="btn-theme" class="btn icon" title="Light or dark theme" aria-label="Switch theme"><span class="theme-sun">☀</span><span class="theme-moon">☾</span></button>
      <button id="btn-lib" class="btn icon" title="Show or hide the chip library" aria-label="Library" aria-pressed="true">▤</button>
      <input id="file-input" type="file" accept=".bbproj,.json,application/json" hidden>
    </nav>
    <div class="tabs" role="tablist" aria-label="Workspaces">
      <button role="tab" class="tab" data-tab="schematic" data-accent="sky" aria-selected="true" id="tab-schematic" aria-controls="ws-schematic">Schematic</button>
      <button role="tab" class="tab" data-tab="breadboard" data-accent="copper" aria-selected="false" id="tab-breadboard" aria-controls="ws-breadboard">Breadboard</button>
      <button role="tab" class="tab" data-tab="analyser" data-accent="berry" aria-selected="false" id="tab-analyser" aria-controls="ws-analyser">Analyser</button>
      <button role="tab" class="tab" data-tab="panel" data-accent="teal" aria-selected="false" id="tab-panel" aria-controls="ws-panel">Front panel</button>
      <button role="tab" class="tab" data-tab="code" data-accent="plum" aria-selected="false" id="tab-code" aria-controls="ws-code">Code</button>
    </div>
  </header>

  <main class="main">
    <div class="workspaces">
      <section id="ws-schematic" class="ws" role="tabpanel" aria-labelledby="tab-schematic"></section>
      <section id="ws-breadboard" class="ws" role="tabpanel" aria-labelledby="tab-breadboard" hidden></section>
      <section id="ws-analyser" class="ws" role="tabpanel" aria-labelledby="tab-analyser" hidden></section>
      <section id="ws-panel" class="ws" role="tabpanel" aria-labelledby="tab-panel" hidden></section>
      <section id="ws-code" class="ws" role="tabpanel" aria-labelledby="tab-code" hidden></section>
    </div>
    <aside id="library" class="library" aria-label="Chip library"></aside>
  </main>

  <footer class="status">
    <span id="engine-status" class="pill" aria-live="polite"><i class="dot"></i><span>Starting engine…</span></span>
    <button id="problems-btn" class="pill btnlike" aria-expanded="false" title="Show problems found by the checker"><span id="problems-count">No problems</span></button>
    <span id="sim-status" class="pill mono"></span>
    <span class="grow"></span>
    <span id="hint" class="hint"></span>
    <a id="about-link" class="pill btnlike about" href="LICENSES/index.html" target="_blank" rel="noopener" title="About Breadboard Bench, and the licences of the software and fonts inside it">About · Licences</a>
  </footer>
  <div id="problems" class="problems" hidden role="region" aria-label="Problems"></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
